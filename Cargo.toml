[package]
name = "wilhelmos_kiosk_demo"
version = "0.3.0"
edition = "2021"
authors = ["Anwar Ludin <anwar.ludin@algonents.com>"]
license = "MIT"
description = "WilhelmOS reference kiosk application: the wilhelmos_kiosk framework demo, packaged"
repository = "https://github.com/algonents/kiosk-app-demo"

# Release rule: a tagged release must not contain git dependencies in its
# lockfile — only published crates.io versions. Git deps are a
# development-time tool only (the WilhelmOS recipe pins tags and fetches
# every locked crate individually).
#
# wilhelm_renderer is used directly for shape geometry types (Triangle);
# keep its version in lockstep with the one wilhelmos_kiosk depends on so
# a single wilhelm_renderer_sys resolves.
[dependencies]
wilhelmos_kiosk = "0.2.0"
wilhelm_renderer = "0.13.0"
